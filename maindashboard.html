<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0A1F44">
<title>Admin Dashboard | AIDS APAANA Foundation</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--red:#C8102E;--red-d:#8B0000;--navy:#0A1F44;--navy2:#12306B;--sky:#4FA8E8;--sky-l:#E6F2FC;--bg:#F3F7FC;--card:#fff;--text:#0F1B33;--gray:#5B6B85;--line:#DCE5F1;--ok:#157A4B;--warn:#9A6200;--w:248px}
*{box-sizing:border-box;margin:0;padding:0}
body{font:15px/1.5 'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--text)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.side{position:fixed;inset:0 auto 0 0;width:var(--w);background:var(--navy);color:#cfe0f5;display:flex;flex-direction:column;padding:18px 12px;overflow-y:auto;z-index:20;transition:transform .2s}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 18px;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:12px}
.brand img{width:40px;height:40px;border-radius:10px;background:#fff;object-fit:contain}
.brand b{font:700 1.15rem 'Playfair Display',serif;color:#fff;display:block;line-height:1.1}
.brand small{color:var(--sky);font-size:.72rem}
.nav button{display:block;width:100%;text-align:left;background:none;border:0;color:inherit;padding:9px 12px;border-radius:8px;cursor:pointer;border-left:3px solid transparent}
.nav button:hover{background:rgba(255,255,255,.07)}
.nav button[aria-current=page]{background:rgba(79,168,232,.18);color:#fff;border-left-color:var(--red)}
.nav h3{font-size:.78rem;font-weight:500;color:var(--sky);padding:14px 12px 4px}
.side .foot{margin-top:auto;padding:12px 8px 0;font-size:.78rem;color:#8fa9cc}
main{margin-left:var(--w);min-height:100vh}
.top{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:12px;padding:12px 24px;background:#fff;border-bottom:1px solid var(--line)}
.top h1{font:700 1.35rem 'Playfair Display',serif;flex:1;color:var(--navy)}
.menu{display:none;background:var(--navy);color:#fff;border:0;border-radius:8px;padding:8px 12px;cursor:pointer}
.who{font-size:.82rem;color:var(--gray);text-align:right;line-height:1.3}
.who b{color:var(--navy);display:block}
.demo{background:#FFF4D6;color:#5C3C00;border-bottom:1px solid #F0D58A;padding:8px 24px;font-size:.85rem}
.demo strong{background:var(--navy);color:#fff;border-radius:4px;padding:1px 7px;margin-right:6px;font-size:.78rem}
.wrap{padding:24px;max-width:1280px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));margin-bottom:24px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;cursor:pointer;text-align:left;border-top:4px solid var(--sky)}
.stat:hover{border-color:var(--sky)}
.stat.hero{background:var(--navy);color:#fff;border-top-color:var(--red);grid-column:span 2}
.stat span{display:block;color:var(--gray);font-size:.85rem}
.stat.hero span{color:#a9c7ee}
.stat b{font:700 1.7rem 'Playfair Display',serif;display:block;margin-top:4px}
.stat em{font-style:normal;font-size:.78rem;color:var(--ok)}
.stat.hero em{color:#7fe0b0}
.cols{display:grid;gap:16px;grid-template-columns:2fr 1fr}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px}
.card h2{font:700 1.1rem 'Playfair Display',serif;color:var(--navy);margin-bottom:12px}
.bar-row{display:flex;gap:8px;align-items:flex-end;height:180px;padding-top:8px}
.bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%;font-size:.75rem;color:var(--gray)}
.bar i{display:block;width:100%;max-width:44px;background:linear-gradient(var(--sky),var(--navy2));border-radius:6px 6px 0 0}
.bar:last-child i{background:var(--red)}
.feed{list-style:none}
.feed li{padding:10px 0;border-bottom:1px solid var(--line);font-size:.9rem}
.feed li:last-child{border:0}
.feed small{display:block;color:var(--gray)}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.tools input,.tools select,.f input,.f select{border:1px solid var(--line);border-radius:8px;padding:9px 12px;background:#fff;min-width:0}
.tools input{flex:1;min-width:180px}
.btn{background:var(--red);color:#fff;border:0;border-radius:8px;padding:9px 16px;font-weight:600;cursor:pointer}
.btn:hover{background:var(--red-d)}
.btn.alt{background:var(--sky-l);color:var(--navy2)}
.btn.sm{padding:5px 10px;font-size:.8rem}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;min-width:620px}
th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);font-size:.9rem;white-space:nowrap}
th{background:var(--sky-l);color:var(--navy);font-weight:600}
tr:last-child td{border:0}
.pill{border-radius:99px;padding:2px 10px;font-size:.78rem;font-weight:600;background:var(--sky-l);color:var(--navy2)}
.pill.ok{background:#DDF3E8;color:var(--ok)}.pill.warn{background:#FFEFC7;color:var(--warn)}.pill.bad{background:#FBDCE1;color:var(--red-d)}
.prog{width:120px;height:8px;background:var(--sky-l);border-radius:9px;overflow:hidden;display:inline-block;vertical-align:middle}
.prog i{display:block;height:100%;background:var(--sky)}
.empty{padding:28px;text-align:center;color:var(--gray)}
.f{display:grid;gap:14px;max-width:560px}
.f label{display:grid;gap:4px;font-weight:500;font-size:.9rem}
.note{font-size:.85rem;color:var(--gray);margin-top:10px}
.toast{position:fixed;right:20px;bottom:20px;background:var(--navy);color:#fff;padding:12px 18px;border-radius:10px;border-left:4px solid var(--red);max-width:320px;opacity:0;transform:translateY(10px);transition:.2s;pointer-events:none;z-index:50}
.toast.on{opacity:1;transform:none}
@media(max-width:900px){.side{transform:translateX(-100%)}.side.open{transform:none}main{margin-left:0}.menu{display:block}.cols{grid-template-columns:1fr}.stat.hero{grid-column:auto}.top,.demo,.wrap{padding-left:16px;padding-right:16px}.who{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<aside class="side" id="side" aria-label="Admin navigation">
  <div class="brand">
    <img src="favicon.png" alt="" onerror="this.style.visibility='hidden'">
    <div><b>AIDS APAANA</b><small>Admin console</small></div>
  </div>
  <nav class="nav" id="nav"></nav>
  <div class="foot">Preview build. Sign-in and database are not connected yet.</div>
</aside>

<main>
  <header class="top">
    <button class="menu" id="menu" aria-label="Open menu">Menu</button>
    <h1 id="title">Dashboard overview</h1>
    <div class="who"><b>Administrator</b>Not signed in (auth not implemented)</div>
    <a class="btn alt" href="index.html" style="text-decoration:none">Public site</a>
  </header>
  <div class="demo"><strong>DEMO DATA</strong>All names, amounts and records below are made-up samples. Nothing is saved, and no login or database is connected.</div>
  <div class="wrap" id="view" tabindex="-1"></div>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ════════════════════════════════════════════════════════
   BACKEND CONNECTION POINT
   Everything the UI shows comes from DataSource. Right now it
   returns the DEMO arrays below. To go live, replace the methods
   with real calls, e.g. with Supabase:

     const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
     list:   async t => (await sb.from(t).select('*').order('created_at',{ascending:false})).data
     remove: async (t,id) => sb.from(t).delete().eq('id',id)

   Also:  1) implement requireAuth() with a real session check
          2) enforce admin-only access with Row Level Security on the server
          3) never ship a service-role key in front-end code
   ════════════════════════════════════════════════════════ */
const CONFIG = { SUPABASE_URL: '', SUPABASE_ANON_KEY: '' };      // empty = demo mode
async function requireAuth(){ return true; }                      // TODO: real session check; returns true only so the demo can render

const DEMO = {
  donations:[
    {id:'D-1001',donor:'Sample Donor A',amount:150000,method:'MTN Mobile Money',campaign:'Community Testing Drive',date:'2026-09-28',status:'Confirmed'},
    {id:'D-1002',donor:'Sample Donor B',amount:50000,method:'Airtel Money',campaign:'Mothers Support Fund',date:'2026-09-27',status:'Confirmed'},
    {id:'D-1003',donor:'Anonymous',amount:500000,method:'Bank transfer',campaign:'School Awareness',date:'2026-09-25',status:'Pending'},
    {id:'D-1004',donor:'Sample Donor C',amount:25000,method:'Card',campaign:'Community Testing Drive',date:'2026-09-24',status:'Failed'},
    {id:'D-1005',donor:'Sample Donor D',amount:80000,method:'MTN Mobile Money',campaign:'Mothers Support Fund',date:'2026-09-22',status:'Confirmed'}],
  volunteers:[
    {id:'V-201',name:'Sample Volunteer 1',email:'vol1@example.org',area:'Outreach',joined:'2026-08-14',status:'Active'},
    {id:'V-202',name:'Sample Volunteer 2',email:'vol2@example.org',area:'Counselling',joined:'2026-08-30',status:'Active'},
    {id:'V-203',name:'Sample Volunteer 3',email:'vol3@example.org',area:'Events',joined:'2026-09-19',status:'Pending'},
    {id:'V-204',name:'Sample Volunteer 4',email:'vol4@example.org',area:'Media',joined:'2026-07-02',status:'Inactive'}],
  campaigns:[
    {id:'C-01',name:'Community Testing Drive',goal:5000000,raised:3200000,ends:'2026-12-01',status:'Active'},
    {id:'C-02',name:'Mothers Support Fund',goal:3000000,raised:2650000,ends:'2026-11-15',status:'Active'},
    {id:'C-03',name:'School Awareness',goal:2000000,raised:2000000,ends:'2026-09-30',status:'Completed'},
    {id:'C-04',name:'Winter Care Packs',goal:1500000,raised:0,ends:'2027-01-20',status:'Draft'}],
  fundraisers:[
    {id:'F-11',title:'Sample Charity Run',owner:'Sample Organiser 1',raised:420000,goal:1000000,status:'Active'},
    {id:'F-12',title:'Sample Bake Sale',owner:'Sample Organiser 2',raised:95000,goal:300000,status:'Pending'},
    {id:'F-13',title:'Sample Online Concert',owner:'Sample Organiser 3',raised:1200000,goal:1200000,status:'Completed'}],
  subscribers:[
    {id:'N-01',email:'reader1@example.org',joined:'2026-09-29',source:'Home page',status:'Subscribed'},
    {id:'N-02',email:'reader2@example.org',joined:'2026-09-26',source:'Donation form',status:'Subscribed'},
    {id:'N-03',email:'reader3@example.org',joined:'2026-09-10',source:'Home page',status:'Unsubscribed'}],
  stories:[
    {id:'S-31',title:'Sample story: a clinic day in the village',author:'Editor',updated:'2026-09-26',status:'Published'},
    {id:'S-32',title:'Sample story: volunteers on the road',author:'Editor',updated:'2026-09-20',status:'Draft'},
    {id:'S-33',title:'Sample story: a year of support groups',author:'Editor',updated:'2026-09-02',status:'Published'}],
  gallery:[
    {id:'G-41',caption:'Sample photo: testing drive day',album:'Outreach',uploaded:'2026-09-18',status:'Published'},
    {id:'G-42',caption:'Sample photo: school visit',album:'Awareness',uploaded:'2026-09-11',status:'Published'},
    {id:'G-43',caption:'Sample photo: volunteer briefing',album:'Team',uploaded:'2026-09-05',status:'Hidden'}],
  users:[
    {id:'U-01',name:'Sample Admin',email:'admin@example.org',role:'Administrator',lastSeen:'2026-10-01',status:'Active'},
    {id:'U-02',name:'Sample Editor',email:'editor@example.org',role:'Editor',lastSeen:'2026-09-30',status:'Active'},
    {id:'U-03',name:'Sample Finance',email:'finance@example.org',role:'Finance',lastSeen:'2026-09-21',status:'Suspended'}],
  months:[['Apr',1.2],['May',1.9],['Jun',1.5],['Jul',2.4],['Aug',2.1],['Sep',3.0]],
  activity:[['Donation D-1001 confirmed','2 hours ago'],['Volunteer V-203 applied','Yesterday'],['Story S-32 saved as draft','3 days ago'],['Campaign C-03 reached its goal','Sep 30'],['New subscriber N-01','Sep 29']]
};
const DataSource = {
  mode: CONFIG.SUPABASE_URL ? 'live' : 'demo',
  async list(t){ return DEMO[t] || []; },                         // TODO: replace with backend read
  async remove(t,id){ return { demo:true }; }                     // TODO: replace with backend delete
};

const ugx = n => 'UGX ' + Number(n).toLocaleString('en-UG');
const tone = s => /Confirmed|Active|Published|Subscribed|Completed/.test(s)?'ok':/Pending|Draft|Hidden/.test(s)?'warn':/Failed|Suspended|Inactive|Unsubscribed/.test(s)?'bad':'';
const pill = s => `<span class="pill ${tone(s)}">${s}</span>`;
const pct = r => Math.min(100, Math.round(r.raised / r.goal * 100));

const TABLES = {
  donations:{title:'Donation management',add:'Record donation',cols:[['id','Ref'],['donor','Donor'],['amount','Amount',ugx],['method','Method'],['campaign','Campaign'],['date','Date'],['status','Status',pill]],filter:'status'},
  volunteers:{title:'Volunteer management',add:'Add volunteer',cols:[['id','Ref'],['name','Name'],['email','Email'],['area','Area'],['joined','Joined'],['status','Status',pill]],filter:'status'},
  campaigns:{title:'Campaign management',add:'New campaign',cols:[['id','Ref'],['name','Campaign'],['goal','Goal',ugx],['raised','Progress',(v,r)=>`<span class="prog"><i style="width:${pct(r)}%"></i></span> ${pct(r)}% (${ugx(v)})`],['ends','Ends'],['status','Status',pill]],filter:'status'},
  fundraisers:{title:'Fundraisers',add:'Approve fundraiser',cols:[['id','Ref'],['title','Fundraiser'],['owner','Organiser'],['raised','Progress',(v,r)=>`<span class="prog"><i style="width:${pct(r)}%"></i></span> ${pct(r)}%`],['status','Status',pill]],filter:'status'},
  subscribers:{title:'Newsletter subscribers',add:'Export list',cols:[['id','Ref'],['email','Email'],['joined','Joined'],['source','Source'],['status','Status',pill]],filter:'status'},
  stories:{title:'Content: stories',add:'New story',cols:[['id','Ref'],['title','Title'],['author','Author'],['updated','Updated'],['status','Status',pill]],filter:'status'},
  gallery:{title:'Content: gallery',add:'Upload photo',cols:[['id','Ref'],['caption','Caption'],['album','Album'],['uploaded','Uploaded'],['status','Status',pill]],filter:'status'},
  users:{title:'Users and roles',add:'Invite user',cols:[['id','Ref'],['name','Name'],['email','Email'],['role','Role'],['lastSeen','Last seen'],['status','Status',pill]],filter:'role'}
};
const NAV = [['overview','Overview'],['h','Manage'],['donations','Donations'],['volunteers','Volunteers'],['campaigns','Campaigns'],['fundraisers','Fundraisers'],['subscribers','Subscribers'],['h','Content'],['stories','Stories'],['gallery','Gallery'],['h','Administration'],['users','Users'],['reports','Reports'],['settings','Settings']];

const $ = s => document.querySelector(s), view = $('#view');
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('on'); clearTimeout(toast.t); toast.t=setTimeout(()=>t.classList.remove('on'),2600); }
const demoOnly = a => toast(a + ': demo only. Connect a backend to enable this.');

function buildNav(){
  $('#nav').innerHTML = NAV.map(([k,l])=> k==='h' ? `<h3>${l}</h3>` : `<button data-v="${k}">${l}</button>`).join('');
  $('#nav').onclick = e => { const b=e.target.closest('button'); if(b){ go(b.dataset.v); $('#side').classList.remove('open'); } };
}

async function overview(){
  const d = {}; for (const k of Object.keys(DEMO)) d[k] = await DataSource.list(k);
  const total = d.donations.filter(x=>x.status==='Confirmed').reduce((s,x)=>s+x.amount,0);
  const stats = [
    ['donations','Total donations (confirmed)',ugx(total),'hero'],['volunteers','Volunteers',d.volunteers.length],['campaigns','Campaigns',d.campaigns.length],
    ['fundraisers','Fundraisers',d.fundraisers.length],['subscribers','Newsletter subscribers',d.subscribers.length],['stories','Stories',d.stories.length],
    ['gallery','Gallery items',d.gallery.length],['users','Users',d.users.length]];
  const max = Math.max(...d.months.map(m=>m[1]));
  view.innerHTML = `<div class="grid">${stats.map(([k,l,v,c])=>`<button class="stat ${c||''}" data-go="${k}"><span>${l}</span><b>${v}</b><em>Demo figure</em></button>`).join('')}</div>
  <div class="cols">
    <section class="card"><h2>Donations by month (UGX millions, demo)</h2><div class="bar-row">${d.months.map(([m,v])=>`<div class="bar">${v}<i style="height:${v/max*100}%"></i>${m}</div>`).join('')}</div></section>
    <section class="card"><h2>Recent activities</h2><ul class="feed">${d.activity.map(a=>`<li>${a[0]}<small>${a[1]}</small></li>`).join('')}</ul></section>
  </div>`;
  view.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
}

async function table(key){
  const T = TABLES[key], rows = await DataSource.list(key);
  const opts = [...new Set(rows.map(r=>r[T.filter]))];
  view.innerHTML = `<div class="tools"><input type="search" id="q" placeholder="Search ${T.title.toLowerCase()}" aria-label="Search"><select id="fl" aria-label="Filter"><option value="">All</option>${opts.map(o=>`<option>${o}</option>`).join('')}</select><button class="btn" id="add">${T.add}</button></div>
  <div class="tw"><table><thead><tr>${T.cols.map(c=>`<th>${c[1]}</th>`).join('')}<th>Actions</th></tr></thead><tbody id="tb"></tbody></table></div>
  <p class="note">Showing sample records only (DEMO DATA). Edit and delete are placeholders until a backend is connected.</p>`;
  const draw = () => {
    const q = $('#q').value.toLowerCase(), f = $('#fl').value;
    const out = rows.filter(r => (!f || r[T.filter]===f) && JSON.stringify(r).toLowerCase().includes(q));
    $('#tb').innerHTML = out.length ? out.map(r=>`<tr>${T.cols.map(([k,,fn])=>`<td>${fn?fn(r[k],r):r[k]}</td>`).join('')}<td><button class="btn alt sm" data-a="Edit">Edit</button> <button class="btn alt sm" data-a="Delete">Delete</button></td></tr>`).join('') : `<tr><td class="empty" colspan="${T.cols.length+1}">No records match. Clear the search or filter.</td></tr>`;
  };
  draw(); $('#q').oninput = draw; $('#fl').onchange = draw; $('#add').onclick = () => demoOnly(T.add);
  $('#tb').onclick = e => { const b=e.target.closest('[data-a]'); if(b) demoOnly(b.dataset.a); };
}

async function reports(){
  const m = await DataSource.list('months'), c = await DataSource.list('campaigns');
  view.innerHTML = `<div class="cols"><section class="card"><h2>Monthly donations (demo)</h2><div class="tw"><table><thead><tr><th>Month</th><th>UGX millions</th></tr></thead><tbody>${m.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</tbody></table></div></section>
  <section class="card"><h2>Campaign progress (demo)</h2>${c.map(x=>`<p style="margin-bottom:10px">${x.name}<br><span class="prog" style="width:100%"><i style="width:${pct(x)}%"></i></span> <small>${pct(x)}%</small></p>`).join('')}<button class="btn" id="exp">Export report</button></section></div>`;
  $('#exp').onclick = () => demoOnly('Export report');
}

function settings(){
  view.innerHTML = `<section class="card"><h2>Organisation settings</h2><div class="f">
    <label>Organisation name<input value="AIDS APAANA Foundation"></label>
    <label>Contact email<input type="email" value="info@apaana.org"></label>
    <label>Currency<select><option>UGX</option><option>USD</option></select></label>
    <label>Backend URL (Supabase or other)<input id="url" placeholder="https://your-project.supabase.co" value="${CONFIG.SUPABASE_URL}"></label>
    <p class="note">Backend status: <span class="pill warn">Not connected (demo mode)</span><br>Only public keys belong in front-end code. Keep service-role keys on a server.</p>
    <div><button class="btn" id="save">Save settings</button></div></div></section>`;
  $('#save').onclick = () => demoOnly('Save settings');
}

async function go(v){
  if (!(await requireAuth())) return;
  document.querySelectorAll('#nav button').forEach(b=>{ if(b.dataset.v===v) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current'); });
  $('#title').textContent = v==='overview'?'Dashboard overview':v==='reports'?'Reports':v==='settings'?'Settings':TABLES[v].title;
  if (v==='overview') await overview(); else if (v==='reports') await reports(); else if (v==='settings') settings(); else await table(v);
  location.hash = v; view.focus({preventScroll:true});
}
$('#menu').onclick = () => $('#side').classList.toggle('open');
buildNav();
go(location.hash.slice(1) in TABLES || ['reports','settings'].includes(location.hash.slice(1)) ? location.hash.slice(1) : 'overview');
</script>
</body>
</html>
